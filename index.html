<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Red social efímera y privada para tus amigos cercanos." />
    <meta property="og:title" content="OnlyFrens" />
    <meta property="og:description" content="Red social efímera y privada para tus amigos cercanos." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://cesarsullen.github.io/onlyfrens/assets/opengraph/opengraph.jpg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="OnlyFrens" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://api.dicebear.com" crossorigin />
    <link rel="icon" type="image/png" href="./assets/opengraph/logo.png" />
    <link rel="apple-touch-icon" href="./assets/opengraph/icon-512.png" />
    <link rel="preload" href="./typography/jost-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./typography/jost-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="modulepreload" href="./js/app.js" />
    <link rel="modulepreload" href="./js/icons.js" />
    <link rel="modulepreload" href="./js/utils.js" />
    <link rel="modulepreload" href="./js/api.js" />
    <link rel="modulepreload" href="./js/post-card.js" />
    <link rel="manifest" href="./manifest.json" />
    <title>OnlyFrens</title>
  </head>
  <body>
    <header class="page-header" id="page-header"></header>
    <main id="app">
      <div class="loader" role="status" aria-label="Cargando">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <clipPath id="loader-back"><rect x="0" y="0" width="100" height="50" /></clipPath>
            <clipPath id="loader-front"><rect x="0" y="50" width="100" height="50" /></clipPath>
          </defs>
          <g transform="rotate(-18 50 50)">
            <g clip-path="url(#loader-back)"><ellipse class="loader-ring" cx="50" cy="50" rx="46" ry="13" pathLength="100" /></g>
            <circle class="loader-planet" cx="50" cy="50" r="22" />
            <g clip-path="url(#loader-front)"><ellipse class="loader-ring" cx="50" cy="50" rx="46" ry="13" pathLength="100" /></g>
          </g>
        </svg>
      </div>
    </main>

    <nav class="bottom-nav" id="bottom-nav" hidden>
      <div class="nav-brand" aria-hidden="true">OnlyFrens</div>
      <button class="nav-item active" data-screen="home" aria-label="Inicio">
        <span class="nav-label">Inicio</span>
      </button>
      <button class="nav-item" data-screen="friends" aria-label="Amigos">
        <span class="nav-label">Amigos</span>
      </button>
      <button class="nav-item" data-screen="notifications" aria-label="Notificaciones">
        <span class="nav-label">Notificaciones</span>
      </button>
      <button class="nav-item" data-screen="profile" aria-label="Perfil">
        <span class="nav-label">Perfil</span>
      </button>
    </nav>

    <button class="fab" id="composer-fab" aria-label="Publicar" hidden>
      <span class="fab-label">Publicar</span>
    </button>

    <div id="toast-container" role="status" aria-live="polite"></div>

    <div id="modal-ui">
      <div class="modal-ui-box" role="dialog" aria-modal="true" aria-labelledby="modal-ui-message">
        <p class="modal-ui-message" id="modal-ui-message"></p>
        <div class="modal-ui-actions" id="modal-ui-actions"></div>
      </div>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
